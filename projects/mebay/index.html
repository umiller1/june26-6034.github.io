<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product | Uniistar</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
            <nav>
                <a href="#" class="logo">Uniistar</a>
                <a href="#">Products</a>
                <a href="#">Collections</a>
                <a href="#">Deals</a>
                <search>
                    <form action="./search/" method="get">
                        <label for="search"></label>
                        <input type="search" name="search" id="search">
                        <button>
                            <img src="images/" alt="Search.">
                        </button>
                    </form>
                </search>
                <a href="#" class="cart">
                    <img src="images/" alt="Search.">
                </a>
            </nav>
        </header>
        <main>
            <section class="sc layout">
                <div id="thumbnails">
                    <div class="ic">
                        <img src="images/" alt="Search.">
                    </div>
                    <div class="ic">
                        <img src="images/" alt="Search.">
                    </div>
                    <div class="ic">
                        <img src="images/" alt="Search.">
                    </div>
                </div>
                <div id="featured">
                    <div class="ic">
                        <img src="images/" alt="Search.">
                    </div>
                </div>
                <div id="product">
                    <h1>Product Name</h1>
                    <div class="seller sbs">
                        <div class="ic">
                            <img src="images/" alt="Search.">
                        </div>
                        <div class="content">
                            <h5><strong>Name</strong><em>(12)</em></h5>
                            <a href="#">Reviews</a>
                            <a href="#">Seller's Shop</a>
                            <a href="#">Contact</a>
                        </div>
                    </div>
                    <h2 id="price">US $35.99</h2>
                    <p class="condition">
                        Condition: <strong>New</strong>
                    </p>
                    <a href="#" class="btn">Buy</a>
                    <a href="#" class="btn alt">Add to Cart</a>
                    <a href="#" class="btn alt">Wishlist</a>
                </div>
            </section>
        </main>
        <footer>
            <nav>

            </nav>
        </footer>
    </body>
</html>
