<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lists Demo</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <ul>
            <li>Wow, I'm the first bullet of a list.</li>
            <li>Wow, I'm the second bullet of this list.</li>
            <li><b>Bold!!!</b></li>
            <li><p><b><em>Wow.</em></b></p></li>
        </ul>
        <ol>
            <li>Panda</li>
            <li>Hyena</li>
            <li>Wolf</li>
            <li>Leopard</li>
        </ol>
    </body>
</html>
